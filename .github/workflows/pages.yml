# Deploy frontend + pitch-deck to GitHub Pages
#
# Repository Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Live URLs (once Pages is enabled):
#   https://lm203688.github.io/nadi-agent/              → frontend/index.html
#   https://lm203688.github.io/nadi-agent/agent-team.html
#   https://lm203688.github.io/nadi-agent/history.html
#   https://lm203688.github.io/nadi-agent/pitch-deck/   → 12-slide deck
#   https://lm203688.github.io/nadi-agent/pitch-deck/index.html

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'pitch-deck/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site root
        run: |
          mkdir -p site
          cp -R frontend/* site/
          mkdir -p site/pitch-deck
          cp -R pitch-deck/* site/pitch-deck/
          # Root redirect to frontend index (already at site/index.html)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
